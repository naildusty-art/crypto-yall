name: Setup Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify gist saving without trading
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TRADING_GIST_ID: ${{ secrets.TRADING_GIST_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import uuid
          import urllib.request
          import urllib.error

          token = os.environ["GIST_TOKEN"].strip()
          gid = os.environ["TRADING_GIST_ID"].strip()
          if not token or len(gid) != 32 or any(
              c not in "0123456789abcdef" for c in gid.lower()
          ):
              raise SystemExit("GIST: invalid token or gist ID")

          url = "https://api.github.com/gists/" + gid
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          }

          def call(method, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  url, data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          probe = "setup_probe_" + uuid.uuid4().hex + ".json"
          marker = uuid.uuid4().hex
          attempted = False
          try:
              data = call("GET")
              original = data["files"]["trading_state.json"]["content"]
              state = json.loads(original)
              print("GIST: owned coins:", state.get("owned_coins", []))
              if "SUI" not in state.get("owned_coins", []):
                  raise SystemExit("GIST: SUI record missing")

              attempted = True
              call("PATCH", {
                  "files": {probe: {"content": marker}}
              })
              saved = call("GET")
              if saved["files"].get(probe, {}).get("content") != marker:
                  raise SystemExit("GIST: save verification failed")
              if saved["files"]["trading_state.json"]["content"] != original:
                  raise SystemExit("GIST: trading record changed during check")
              print("GIST: write and read-back succeeded")
          except urllib.error.HTTPError as error:
              raise SystemExit("GIST: HTTP error " + str(error.code))
          finally:
              if attempted:
                  call("PATCH", {"files": {probe: None}})
                  remaining = call("GET")
                  if probe in remaining["files"]:
                      raise SystemExit("GIST: temporary file cleanup failed")
                  print("GIST: temporary test file removed")
          PY
